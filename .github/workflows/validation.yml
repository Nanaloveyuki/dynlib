name: validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$HOME\\.moon\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: moon fmt --check
      - run: moon check --target native --deny-warn --warn-list +73
      - run: moon test --target native --deny-warn --warn-list +73
      - run: moon info
      - run: git diff --exit-code
